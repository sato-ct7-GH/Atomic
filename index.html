<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>原子分野の基本知識</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
      background:#edf2f7;color:#1a202c;min-height:100vh;
    }

    /* ===== ヘッダー ===== */
    header{
      background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 100%);
      color:#fff;padding:14px 18px 12px;text-align:center;
      box-shadow:0 2px 8px rgba(0,0,0,.25);
    }
    .hdr-school{font-size:11px;opacity:.75;margin-bottom:4px;letter-spacing:.5px;}
    .hdr-title{font-size:19px;font-weight:700;letter-spacing:.5px;}
    .hdr-sub{font-size:12px;opacity:.8;margin-top:4px;min-height:1em;}

    /* ===== セクションタブ ===== */
    .tabs{
      background:#1e3a8a;
    }
    .tabs-inner{
      display:flex;max-width:600px;margin:0 auto;
      overflow-x:auto;-webkit-overflow-scrolling:touch;
    }
    .tab{
      flex:1;min-width:50px;padding:10px 2px;text-align:center;
      font-size:12px;font-weight:600;color:rgba(255,255,255,.5);
      cursor:pointer;border-bottom:3px solid transparent;
      transition:all .2s;user-select:none;white-space:nowrap;
    }
    .tab.active{color:#fbbf24;border-bottom-color:#fbbf24;}
    .tab.disabled{opacity:.3;cursor:not-allowed;}

    /* ===== メイン ===== */
    .main{max-width:600px;margin:0 auto;padding:14px 13px 70px;}

    /* ===== モード切替 ===== */
    .mode-row{
      display:flex;background:#fff;border-radius:10px;
      overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1);margin-bottom:14px;
    }
    .mode-btn{
      flex:1;padding:11px 6px;border:none;background:#fff;
      color:#6b7280;font-size:12.5px;font-weight:500;
      cursor:pointer;font-family:inherit;transition:all .2s;
    }
    .mode-btn.active{background:#2563eb;color:#fff;}

    /* ===== 進捗・スコア ===== */
    .prog-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
    .prog-bar{flex:1;height:5px;background:#cbd5e1;border-radius:3px;}
    .prog-fill{height:100%;background:#2563eb;border-radius:3px;transition:width .35s ease;}
    .prog-text{font-size:12px;color:#64748b;white-space:nowrap;}
    .score-row{text-align:right;font-size:13px;color:#64748b;margin-bottom:12px;}

    .q-card{
      background:#fff;border-radius:12px;padding:18px 20px;
      margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.09);
      border-left:4px solid #2563eb;
    }
    .q-num{font-size:11px;font-weight:700;color:#2563eb;margin-bottom:7px;letter-spacing:.5px;}
    .retry-badge{
      display:inline-block;background:#fff7ed;border:1.5px solid #fb923c;
      color:#c2410c;font-size:12px;font-weight:700;
      padding:5px 12px;border-radius:20px;margin-bottom:10px;
    }
    .q-img{display:block;max-width:33%;height:auto;border-radius:8px;margin-bottom:12px;border:1px solid #e2e8f0;}
    .q-text{font-size:15px;line-height:1.75;}

    .choices{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
    .choice-btn{
      width:100%;padding:12px 16px;background:#fff;
      border:2px solid #e2e8f0;border-radius:8px;cursor:pointer;
      font-size:14px;text-align:left;color:#374151;
      transition:all .15s;font-family:inherit;line-height:1.6;
    }
    .choice-btn:hover:not(:disabled){border-color:#93c5fd;background:#eff6ff;}
    .choice-btn.correct{border-color:#34d399;background:#ecfdf5;color:#065f46;font-weight:600;}
    .choice-btn.wrong{border-color:#f87171;background:#fef2f2;color:#991b1b;}
    .choice-btn:disabled{cursor:default;}

    .feedback{
      padding:12px 16px;border-radius:8px;font-size:13px;
      line-height:1.65;display:none;margin-bottom:12px;
    }
    .feedback.ok{display:block;background:#ecfdf5;border:1px solid #6ee7b7;color:#065f46;}
    .feedback.ng{display:block;background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;}
    .fb-expl{display:inline-block;margin-top:6px;font-weight:400;color:#78350f;}

    .next-btn{
      width:100%;padding:13px;background:#2563eb;color:#fff;
      border:none;border-radius:8px;font-size:15px;font-weight:600;
      cursor:pointer;font-family:inherit;transition:background .2s;
    }
    .next-btn:hover{background:#1e3a8a;}

    /* ===== 初学モード：解答・解説 ===== */
    .intro-answer{
      background:#ecfdf5;border:1px solid #6ee7b7;border-radius:10px;
      padding:14px 18px;margin-bottom:14px;
    }
    .intro-answer-label{font-size:11px;font-weight:700;color:#059669;letter-spacing:.5px;margin-bottom:6px;}
    .intro-answer-text{font-size:16px;font-weight:700;color:#065f46;margin-bottom:10px;line-height:1.6;}
    .intro-expl{font-size:13.5px;line-height:1.75;color:#374151;border-top:1px dashed #a7f3d0;padding-top:10px;}
    .intro-expl-icon{margin-right:4px;}

    /* ===== 結果画面 ===== */
    .result-card{
      background:#fff;border-radius:16px;padding:40px 24px;
      text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1);
    }
    .result-emoji{font-size:56px;margin-bottom:14px;}
    .result-score{font-size:56px;font-weight:800;color:#2563eb;line-height:1;}
    .result-total{font-size:17px;color:#64748b;margin-bottom:6px;}
    .result-pct{font-size:28px;font-weight:700;color:#374151;margin-bottom:28px;}
    .retry-btn{
      padding:12px 36px;background:#2563eb;color:#fff;border:none;
      border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;
    }
    .retry-btn:hover{background:#1e3a8a;}
    .result-actions{display:flex;flex-direction:column;gap:10px;}

    /* ===== 送信モード ===== */
    .name-card{
      background:#fff;border-radius:12px;padding:16px 20px;
      margin-bottom:13px;box-shadow:0 1px 4px rgba(0,0,0,.08);
    }
    .name-label{font-size:13px;font-weight:600;color:#374151;margin-bottom:8px;display:block;}
    .name-input{
      width:100%;padding:10px 14px;border:2px solid #e2e8f0;
      border-radius:8px;font-size:15px;font-family:inherit;
      outline:none;color:#1a202c;transition:border-color .2s;
    }
    .name-input:focus{border-color:#2563eb;}

    .sub-result{
      padding:16px;border-radius:10px;text-align:center;
      margin-bottom:16px;font-size:14px;line-height:1.8;
    }
    .sub-result.ok{background:#ecfdf5;border:1px solid #6ee7b7;color:#065f46;}
    .sub-result.warn{background:#fffbeb;border:1px solid #fcd34d;color:#92400e;}

    .sm-explanation{
      display:flex;gap:10px;align-items:flex-start;
      background:#fffbeb;border:1px solid #fcd34d;
      border-radius:8px;padding:12px 14px;
      font-size:13px;line-height:1.7;color:#78350f;
      margin-bottom:12px;
    }
    .sm-expl-icon{font-size:18px;flex-shrink:0;margin-top:1px;}
    .sm-final-card{
      background:#fff;border-radius:16px;padding:36px 24px;
      text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1);
    }
    .sm-final-icon{font-size:52px;margin-bottom:12px;}
    .sm-final-title{font-size:17px;font-weight:700;color:#1a202c;margin-bottom:6px;}
    .sm-final-name{font-size:15px;color:#2563eb;font-weight:600;margin-bottom:20px;}
    .sm-start-btn{
      width:100%;padding:13px;background:#2563eb;color:#fff;border:none;
      border-radius:8px;font-size:15px;font-weight:600;
      cursor:pointer;font-family:inherit;margin-bottom:0;
      transition:background .2s;
    }
    .sm-start-btn:hover{background:#1e3a8a;}
    .submit-btn{
      width:100%;padding:14px;background:#059669;color:#fff;border:none;
      border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;
      font-family:inherit;margin-bottom:14px;transition:background .2s;
    }
    .submit-btn:hover{background:#047857;}
    .submit-btn:disabled{background:#9ca3af;cursor:not-allowed;}

    /* ===== 完了カード（初学モード） ===== */
    .done-card{
      background:#fff;border-radius:16px;padding:40px 24px;
      text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1);
    }
    .done-icon{font-size:52px;margin-bottom:14px;}
    .done-title{font-size:18px;font-weight:700;color:#1a202c;margin-bottom:6px;}
    .done-sub{font-size:13px;color:#64748b;margin-bottom:24px;}
    .done-actions{display:flex;flex-direction:column;gap:10px;}

    /* ===== 準備中 ===== */
    .coming-card{
      background:#fff;border-radius:16px;padding:50px 24px;
      text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08);color:#6b7280;
    }
    .coming-icon{font-size:48px;margin-bottom:14px;}
    .coming-title{font-size:18px;font-weight:600;color:#374151;margin-bottom:8px;}
    .coming-text{font-size:14px;}

    /* ===== 学習順/ランダム切替 ===== */
    .order-row{
      display:flex;align-items:center;gap:6px;margin-bottom:10px;
    }
    .order-label{font-size:12px;color:#64748b;margin-right:2px;white-space:nowrap;}
    .order-btn{
      padding:5px 14px;border-radius:20px;border:1.5px solid #cbd5e1;
      background:#fff;color:#64748b;font-size:12px;font-weight:600;
      cursor:pointer;font-family:inherit;transition:all .2s;
    }
    .order-btn.active{background:#2563eb;border-color:#2563eb;color:#fff;}
    .order-btn:hover:not(.active){background:#f1f5f9;border-color:#93c5fd;}

    /* KaTeX調整 */
    .katex{font-size:1em;}
    .katex-display{margin:.3em 0;}
  </style>
</head>
<body>

<header>
  <div class="hdr-school">神奈川県立湘南高等学校　物理</div>
  <div class="hdr-title">⚛️ 原子分野の基本知識</div>
  <div class="hdr-sub" id="hdrSub"></div>
</header>

<div class="tabs"><div class="tabs-inner" id="tabs"></div></div>

<div class="main">
  <div class="mode-row">
    <button class="mode-btn" id="modeIntro"  onclick="setMode('intro')">🔰 初学モード</button>
    <button class="mode-btn" id="modeStudy"  onclick="setMode('study')">📖 自習モード</button>
    <button class="mode-btn" id="modeSubmit" onclick="setMode('submit')">📤 送信モード</button>
  </div>
  <div id="content"></div>
</div>

// ============================================================
// 状態管理
// ============================================================
let curSec    = 1;
let curMode   = 'study';   // 'intro' | 'study' | 'submit'
let orderMode = 'seq';     // 自習モードの出題順　'seq'=学習順  'rand'=ランダム

const im = {          // 初学モード状態
  secId : null,
  idx   : 0
};

const ss = {           // 自習モード状態
  secId     : null,
  total     : 0,        // このセクションの問題数（初回出題ベース）
  queue     : [],        // 出題キュー（不正解は末尾に再投入）
  solved    : new Set(), // 正解済みの問題ID
  attempted : new Set(), // 一度でも解答した問題ID（2回目以降＝再チャレンジ判定に使用）
  answered  : false,
  correct   : 0,          // 1回目解答時点での正解数
  wrong     : 0,          // 1回目解答時点での不正解数
  lastCorrect: false,      // 直前の解答が正解だったか（ボタン表示の判定用）
  chosen    : []
};

const sm = {           // 送信モード状態
  secId     : null,
  num       : '',
  name      : '',
  started   : false,
  total     : 0,
  queue     : [],
  solved    : new Set(),
  attempted : new Set(),
  firstAttemptCorrect: {}, // 問題ID → 1回目解答が正解だったか（記録送信に使用）
  answered  : false,
  lastCorrect: false,
  lastPickedCi: null,      // 直前に選んだ選択肢（シャッフル後の元インデックス）
  chosen    : []
};

// ============================================================
// ユーティリティ
// ============================================================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function doMath(el) {
  if (window.renderMathInElement) {
    renderMathInElement(el, {
      delimiters: [
        { left: '\\(', right: '\\)', display: false },
        { left: '\\[', right: '\\]', display: true  }
      ],
      throwOnError: false
    });
  }
}

// ============================================================
// タブ・モード
// ============================================================
function buildTabs() {
  document.getElementById('tabs').innerHTML = SECTIONS.map(s => `
    <div class="tab ${s.id === curSec ? 'active' : ''} ${!s.available ? 'disabled' : ''}"
         onclick="${s.available ? `setSec(${s.id})` : ''}">
      ${s.label}
    </div>
  `).join('');
}

function setSec(id) {
  curSec      = id;
  im.secId    = null;  // セクション変更→各モードの状態をリセット
  ss.secId    = null;
  sm.started  = false;
  buildTabs();
  render();
}

function setMode(mode) {
  curMode = mode;
  document.getElementById('modeIntro' ).classList.toggle('active', mode === 'intro' );
  document.getElementById('modeStudy' ).classList.toggle('active', mode === 'study' );
  document.getElementById('modeSubmit').classList.toggle('active', mode === 'submit');
  render();
}

// ============================================================
// メインレンダー
// ============================================================
function render() {
  const sec = SECTIONS.find(s => s.id === curSec);
  document.getElementById('hdrSub').textContent = sec.subtitle || '';

  if (!sec.available) {
    document.getElementById('content').innerHTML = `
      <div class="coming-card">
        <div class="coming-icon">🔧</div>
        <div class="coming-title">準備中</div>
        <div class="coming-text">${sec.label} は現在準備中です。</div>
      </div>`;
    return;
  }

  if      (curMode === 'intro')  renderIntro(sec);
  else if (curMode === 'study')  renderStudy(sec);
  else                            renderSubmit(sec);
}

// ============================================================
// 初学モード：選択肢なし、解答・解説をはじめから表示
// ============================================================
function renderIntro(sec) {
  if (im.secId !== sec.id) {
    im.secId = sec.id;
    im.idx   = 0;
  }
  if (im.idx >= sec.questions.length) {
    renderIntroDone(sec);
    return;
  }

  const q     = sec.questions[im.idx];
  const total = sec.questions.length;
  const pct   = Math.round((im.idx / total) * 100);
  const expl  = EXPLANATIONS[q.id] || '';

  const el = document.getElementById('content');
  el.innerHTML = `
    <div class="prog-row">
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="prog-text">${im.idx + 1} / ${total}</div>
    </div>

    <div class="q-card">
      <div class="q-num">問 ${q.id}</div>
      ${q.image ? `<img class="q-img" src="${q.image}" alt="図${q.id}">` : ''}
      <div class="q-text">${q.text}</div>
    </div>

    <div class="intro-answer">
      <div class="intro-answer-label">✅ 解答</div>
      <div class="intro-answer-text">${q.choices[0]}</div>
      <div class="intro-expl"><span class="intro-expl-icon">💡</span>${expl}</div>
    </div>

    <button class="next-btn" onclick="nextIntroQ()">
      ${im.idx + 1 < total ? '次の問題 →' : '✅ セクション修了 →'}
    </button>
  `;

  doMath(el);
}

function nextIntroQ() {
  im.idx++;
  renderIntro(SECTIONS.find(s => s.id === curSec));
}

function renderIntroDone(sec) {
  document.getElementById('content').innerHTML = `
    <div class="done-card">
      <div class="done-icon">🎓</div>
      <div class="done-title">${sec.label}（${sec.subtitle}）の学習が終わりました</div>
      <div class="done-sub">全 ${sec.questions.length} 問を確認しました。次は自習モードで理解度を確かめましょう。</div>
      <div class="done-actions">
        <button class="next-btn" onclick="restartIntro()">🔄 もう一度読み直す</button>
        <button class="next-btn" style="background:#059669;" onclick="setMode('study')">📖 自習モードへ進む</button>
      </div>
    </div>`;
}

function restartIntro() {
  im.idx = 0;
  renderIntro(SECTIONS.find(s => s.id === curSec));
}

// ============================================================
// 自習モード（4択・即時採点）
// ============================================================
function setOrderMode(mode) {
  orderMode   = mode;
  ss.secId    = null; // 切替時に出題をリセット
  ss.chosen   = [];
  render();
}

function startStudy(sec) {
  ss.secId     = sec.id;
  ss.total     = sec.questions.length;
  ss.queue     = orderMode === 'rand'
                   ? shuffle(sec.questions)
                   : [...sec.questions]; // 学習順：Q1から順番
  ss.solved    = new Set();
  ss.attempted = new Set();
  ss.answered  = false;
  ss.correct   = 0;
  ss.wrong     = 0;
  ss.chosen    = [];
  renderStudy(sec);
}

function renderStudy(sec) {
  if (ss.secId !== sec.id || ss.queue.length === 0 && ss.solved.size === 0) {
    startStudy(sec);
    return;
  }
  if (ss.queue.length === 0) {
    renderResult(sec);
    return;
  }

  const q       = ss.queue[0];
  const isRetry = ss.attempted.has(q.id);
  const pct     = Math.round((ss.solved.size / ss.total) * 100);

  if (ss.chosen.length === 0) {
    ss.chosen = shuffle(q.choices.map((_, i) => i));
  }

  // このあと解答すると出題キューが空になるかどうか（ボタン文言の判定用）
  const willFinish = ss.answered && (ss.lastCorrect ? ss.queue.length - 1 === 0 : false);

  const el = document.getElementById('content');
  el.innerHTML = `
    <div class="order-row">
      <span class="order-label">出題順：</span>
      <button class="order-btn ${orderMode === 'seq'  ? 'active' : ''}"
              onclick="setOrderMode('seq')">学習順</button>
      <button class="order-btn ${orderMode === 'rand' ? 'active' : ''}"
              onclick="setOrderMode('rand')">ランダム</button>
    </div>
    <div class="prog-row">
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="prog-text">${ss.solved.size} / ${ss.total} 問正解</div>
    </div>
    <div class="score-row" id="scoreRow">✅ ${ss.correct} &nbsp;❌ ${ss.wrong}</div>

    ${isRetry ? `<div class="retry-badge">🔄 再チャレンジ問題</div>` : ''}
    <div class="q-card">
      <div class="q-num">問 ${q.id}</div>
      ${q.image ? `<img class="q-img" src="${q.image}" alt="図${q.id}">` : ''}
      <div class="q-text">${q.text}</div>
    </div>

    <div class="choices" id="clist">
      ${ss.chosen.map((ci, pos) => `
        <button class="choice-btn" id="cb${pos}" onclick="pick(${pos})"
                ${ss.answered ? 'disabled' : ''}>
          ${q.choices[ci]}
        </button>`).join('')}
    </div>

    <div class="feedback" id="fb"></div>

    <button class="next-btn" id="nb" onclick="nextQ()" style="display:none;">
      ${willFinish ? '結果を見る →' : '次の問題 →'}
    </button>
  `;

  doMath(el);
}

function pick(pos) {
  if (ss.answered) return;
  ss.answered = true;

  const q            = ss.queue[0];
  const isCorrect     = ss.chosen[pos] === 0;
  const firstAttempt  = !ss.attempted.has(q.id);

  if (firstAttempt) {
    ss.attempted.add(q.id);
    if (isCorrect) ss.correct++;
    else           ss.wrong++;
  }
  if (isCorrect) ss.solved.add(q.id);
  ss.lastCorrect = isCorrect;

  ss.chosen.forEach((ci, p) => {
    const btn = document.getElementById(`cb${p}`);
    if (!btn) return;
    btn.disabled = true;
    if (ci === 0)       btn.classList.add('correct');
    else if (p === pos) btn.classList.add('wrong');
  });

  const fb   = document.getElementById('fb');
  const expl = EXPLANATIONS[q.id] || '';
  if (isCorrect) {
    fb.className = 'feedback ok';
    fb.innerHTML = `✅ 正解です！${expl ? `<br><span class="fb-expl">💡 ${expl}</span>` : ''}`;
  } else {
    fb.className = 'feedback ng';
    fb.innerHTML = `❌ 不正解。正解は「${q.choices[0]}」です。もう一度あとで出題されます。${expl ? `<br><span class="fb-expl">💡 ${expl}</span>` : ''}`;
  }
  doMath(fb);

  document.getElementById('scoreRow').innerHTML = `✅ ${ss.correct} &nbsp;❌ ${ss.wrong}`;

  const nb = document.getElementById('nb');
  const willFinish = isCorrect && ss.queue.length - 1 === 0;
  nb.textContent = willFinish ? '結果を見る →' : '次の問題 →';
  nb.style.display = 'block';
}

function nextQ() {
  const q = ss.queue.shift();
  if (!ss.solved.has(q.id)) ss.queue.push(q); // 不正解だった問題は末尾に再投入
  ss.answered = false;
  ss.chosen   = [];
  renderStudy(SECTIONS.find(s => s.id === curSec));
}

function renderResult(sec) {
  const total = ss.total;
  const c     = ss.correct;
  const pct   = Math.round((c / total) * 100);
  const emoji = pct >= 90 ? '🎉' : pct >= 70 ? '👍' : pct >= 50 ? '🤔' : '😢';

  document.getElementById('content').innerHTML = `
    <div class="result-card">
      <div class="result-emoji">${emoji}</div>
      <div class="result-score">${c}</div>
      <div class="result-total">/ ${total} 問正解（1回目の解答時点）</div>
      <div class="result-pct">正答率 ${pct}%</div>
      <div class="result-actions">
        <button class="retry-btn"
                onclick="startStudy(SECTIONS.find(s=>s.id===${curSec}))">
          🔄 もう一度やり直す
        </button>
      </div>
    </div>`;
}

// ============================================================
// 送信モード
// ============================================================
function renderSubmit(sec) {
  if (sm.secId !== sec.id || !sm.started) {
    renderSubmitIntro(sec);
    return;
  }
  if (sm.queue.length === 0) {
    renderSubmitFinal(sec);
    return;
  }
  renderSubmitQuestion(sec);
}

/* ── 氏名入力画面 ── */
function renderSubmitIntro(sec) {
  document.getElementById('content').innerHTML = `
    <div class="name-card">
      <label class="name-label" for="snum">組番号を入力してください</label>
      <input type="text" class="name-input" id="snum"
             placeholder="例：A01～E40"
             value="${sm.secId === sec.id ? sm.num : ''}">
    </div>
    <div class="name-card">
      <label class="name-label" for="sname">氏名を入力してください</label>
      <input type="text" class="name-input" id="sname"
             placeholder="例：湘南 太郎"
             value="${sm.secId === sec.id ? sm.name : ''}">
    </div>
    <button class="sm-start-btn" onclick="startSubmitQuiz(${sec.id})">
      ✏️ 回答を開始する（全 ${sec.questions.length} 問）
    </button>`;
}

function startSubmitQuiz(secId) {
  const num  = document.getElementById('snum').value.trim();
  const name = document.getElementById('sname').value.trim();
  if (!num)  { alert('組番号を入力してください。'); return; }
  if (!name) { alert('氏名を入力してください。');   return; }
  const sec = SECTIONS.find(s => s.id === secId);
  sm.secId     = secId;
  sm.num       = num;
  sm.name      = name;
  sm.started   = true;
  sm.startedAt = Date.now();          // 所要時間の計測用
  sm.total     = sec.questions.length;
  sm.queue     = [...sec.questions]; // 送信モードは学習順（連番）で出題
  sm.solved    = new Set();
  sm.attempted = new Set();
  sm.firstAttemptCorrect = {};
  sm.answered  = false;
  sm.chosen    = [];
  sm.lastPickedCi = null;
  renderSubmit(sec);
}

/* ── 一問表示 ── */
function renderSubmitQuestion(sec) {
  const q       = sm.queue[0];
  const isRetry = sm.attempted.has(q.id);
  const pct     = Math.round((sm.solved.size / sm.total) * 100);

  if (sm.chosen.length === 0) {
    sm.chosen = shuffle(q.choices.map((_, i) => i));
  }

  const expl       = EXPLANATIONS[q.id] || '';
  const selectedCi = sm.lastPickedCi;
  const willFinish = sm.answered && sm.lastCorrect && sm.queue.length - 1 === 0;

  const el = document.getElementById('content');
  el.innerHTML = `
    <div class="prog-row">
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="prog-text">${sm.solved.size} / ${sm.total} 問正解</div>
    </div>

    ${isRetry ? `<div class="retry-badge">🔄 再チャレンジ問題</div>` : ''}
    <div class="q-card">
      <div class="q-num">問 ${q.id}</div>
      ${q.image ? `<img class="q-img" src="${q.image}" alt="図${q.id}">` : ''}
      <div class="q-text">${q.text}</div>
    </div>

    <div class="choices">
      ${sm.chosen.map((ci, pos) => {
        let cls = '';
        if (sm.answered) {
          if (ci === 0)                           cls = 'correct';
          else if (ci === selectedCi && ci !== 0) cls = 'wrong';
        }
        return `
          <button class="choice-btn ${cls}" id="smcb${pos}"
                  onclick="pickSubmit(${pos})"
                  ${sm.answered ? 'disabled' : ''}>
            ${q.choices[ci]}
          </button>`;
      }).join('')}
    </div>

    ${sm.answered ? `
      <div class="sm-explanation">
        <span class="sm-expl-icon">💡</span>
        <span>${expl}</span>
      </div>
      <button class="next-btn" onclick="nextSubmitQ()">
        ${willFinish ? '✅ 送信画面へ →' : '次の問題 →'}
      </button>
    ` : ''}
  `;

  doMath(el);
}

function pickSubmit(pos) {
  if (sm.answered) return;
  sm.answered = true;
  const sec = SECTIONS.find(s => s.id === sm.secId);
  const q   = sm.queue[0];

  const isCorrect    = sm.chosen[pos] === 0;
  const firstAttempt = !sm.attempted.has(q.id);

  if (firstAttempt) {
    sm.attempted.add(q.id);
    sm.firstAttemptCorrect[q.id] = isCorrect;
  }
  if (isCorrect) sm.solved.add(q.id);
  sm.lastCorrect  = isCorrect;
  sm.lastPickedCi = sm.chosen[pos];

  renderSubmitQuestion(sec);
}

function nextSubmitQ() {
  const q = sm.queue.shift();
  if (!sm.solved.has(q.id)) sm.queue.push(q); // 不正解だった問題は末尾に再投入
  sm.answered     = false;
  sm.chosen       = [];
  sm.lastPickedCi = null;
  renderSubmit(SECTIONS.find(s => s.id === sm.secId));
}

/* ── 送信確認画面 ── */
function renderSubmitFinal(sec) {
  document.getElementById('content').innerHTML = `
    <div class="sm-final-card">
      <div class="sm-final-icon">📝</div>
      <div class="sm-final-title">全 ${sec.questions.length} 問の回答が完了しました</div>
      <div class="sm-final-name">${sm.name} さん</div>
      <button class="submit-btn" id="sbtn" onclick="doSubmit(${sec.id})">
        📤 回答を送信する
      </button>
      <div id="sresult"></div>
    </div>`;
}

// ============================================================
//  記録送信（学習記録ハブ  スキーマ v1）
// ============================================================
// ★ハブGASのデプロイURLをここに貼る（空のままだと下の旧送信先だけに送る）
const HUB_URL = 'https://script.google.com/macros/s/AKfycbwnV8z1aoFsLF0NEEgFXZEVktKKNVqm8Fnvrm4Z772M1df-VZKJRAljAZBHgRkInIVX/exec';

// 単元マスタ.xlsx「アプリ設定」シートの atomic の行から転記
const APP_ID  = 'atomic';
const UNIT_ID = 'ATM01';
// ★配列の並びはタブ（基本①〜⑥）の並びと一致させること
const SEC_IDS = ['ATM01-S1', 'ATM01-S2', 'ATM01-S3',
                 'ATM01-S4', 'ATM01-S5', 'ATM01-S6'];

// 移行期のみ true。旧スプレッドシート（回答_基本①〜⑥）にも同じ内容を送る。
// ハブ側で記録できていることを確認したら false にする。
const SEND_LEGACY = true;
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxC0g3YR9TVrsWODUQiWMd61HK3McpeqspUSkX1IQxViSAQf0kJyzv66VYCyOuZLl-s/exec';

let _sub = null;   // 直前の送信内容（結果表示用）

function doSubmit(secId) {
  const sec     = SECTIONS.find(s => s.id === secId);
  const qids    = sec.questions.map(q => q.id);
  const correct = qids.filter(id => sm.firstAttemptCorrect[id]).length;
  const elapsed = sm.startedAt ? Math.round((Date.now() - sm.startedAt) / 1000) : 0;

  _sub = { num: sm.num, name: sm.name, correct, total: qids.length };

  // 送信先がどちらも未設定なら得点のみ表示
  if (!HUB_URL && !(SEND_LEGACY && GAS_URL)) {
    document.getElementById('sresult').innerHTML = `
      <div class="sub-result warn">
        ⚠️ 送信先が未設定です。<br>
        <strong>${_sub.num}　${_sub.name}</strong> さんの得点：<strong>${correct} / ${_sub.total}</strong>（1回目の解答時点）<br>
        HUB_URL の設定後に送信できるようになります。
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px;">
        <button class="next-btn" onclick="setMode('study')">📖 自習モードで学習する</button>
      </div>`;
    return;
  }

  const btn = document.getElementById('sbtn');
  if (btn) { btn.disabled = true; btn.textContent = '📤 送信中…'; }

  sendRecord(sec, qids, correct, elapsed).then(ok => showSubmitResult(ok, btn));
}

/* ── ハブ（＋移行期は旧GAS）へ送信 ── */
async function sendRecord(sec, qids, correct, elapsed) {
  const marks = qids.map(id => (sm.firstAttemptCorrect[id] ? '1' : '0')).join('');
  let ok = null;

  if (HUB_URL) {
    const secId = SEC_IDS[sec.id - 1];
    if (!secId) {
      console.error('SEC_IDS に ' + sec.label + ' の定義がありません');
    } else {
      const p = new URLSearchParams();
      p.set('v',       '1');
      p.set('app',     APP_ID);
      p.set('unit',    UNIT_ID);
      p.set('sec',     secId);          // ★恒久ID。単元マスタとの結合キー
      p.set('section', sec.label);      // 保険（マスタ側の名前が優先される）
      p.set('cls',     sm.num);         // 組番号 → 名簿で生徒IDに解決される
      p.set('name',    sm.name);
      p.set('mode',    '送信');
      p.set('qids',    qids.join(','));
      p.set('marks',   marks);          // 例 "1011…"（○×より遥かに短い）
      p.set('elapsed', String(elapsed));
      p.set('comment', '');
      ok = await beacon(HUB_URL + '?' + p.toString());
    }
  }

  if (SEND_LEGACY && GAS_URL) {
    const q = new URLSearchParams({
      num      : sm.num,
      name     : sm.name,
      section  : sec.label,
      correct  : String(correct),
      total    : String(qids.length),
      qids     : qids.join(','),
      timestamp: new Date().toLocaleString('ja-JP')
    });
    qids.forEach(id => q.append('q' + id, sm.firstAttemptCorrect[id] ? '○' : '×'));
    const ok2 = await beacon(GAS_URL + '?' + q.toString());
    if (ok === null) ok = ok2;         // ハブ未設定のときは旧送信の結果を採用
  }

  return ok === true;
}

/* ── 画像ビーコン方式（CSP・CORSの影響を受けにくい）／最大3回試行 ── */
function beacon(url) {
  const MAX_RETRY = 3;
  return (async () => {
    for (let i = 0; i < MAX_RETRY; i++) {
      const btn = document.getElementById('sbtn');
      if (btn && i > 0) btn.textContent = `🔄 再送信中… (${i + 1}/${MAX_RETRY})`;
      const reached = await new Promise(resolve => {
        const img   = new Image();
        const timer = setTimeout(() => resolve(false), 6000);
        img.onload  = () => { clearTimeout(timer); resolve(true); };
        img.onerror = () => { clearTimeout(timer); resolve(true); };  // 到達はしている
        img.src = url;
      });
      if (reached) return true;
      await new Promise(r => setTimeout(r, 1500));
    }
    return false;
  })();
}

/* ── 結果表示 ── */
function showSubmitResult(ok, btn) {
  const { num, name, correct, total } = _sub;
  const el = document.getElementById('sresult');
  if (!el) return;

  if (ok) {
    el.innerHTML = `
      <div class="sub-result ok">
        ✅ 送信完了しました。お疲れ様でした！<br>
        <strong>${num}　${name}</strong> さんの得点：<strong>${correct} / ${total}</strong>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px;">
        <button class="next-btn" onclick="setMode('study')">
          📖 自習モードで学習する
        </button>
        <button class="next-btn"
                style="background:#059669;"
                onclick="sm.started=false; setMode('submit')">
          📤 送信モードでもう一度
        </button>
      </div>`;
  } else {
    el.innerHTML = `
      <div class="sub-result warn">
        ❌ 送信に失敗しました。ネットワークを確認してもう一度お試しください。<br>
        <strong>${num}　${name}</strong> さんの得点：<strong>${correct} / ${total}</strong>
      </div>`;
    if (btn) { btn.disabled = false; btn.textContent = '📤 もう一度送信する'; }
  }
}

  buildTabs();
  document.getElementById('modeStudy').classList.add('active');
  render();
});
